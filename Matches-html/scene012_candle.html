  <g id="card" opacity="0" mask="url(#m101)">
    <rect width="1920" height="1080" fill="#e9dcc0"/><rect width="1920" height="1080" fill="#000" filter="url(#paper)"/><rect width="1920" height="1080" fill="url(#stain)"/>
    <g fill="none" stroke="#c9b27c" stroke-linecap="round" opacity=".45" filter="url(#paint)"><path d="M-40 210 C500 150 1300 260 1960 190" stroke-width="90"/><path d="M-40 560 C600 620 1200 500 1960 580" stroke-width="120"/><path d="M-40 900 C500 850 1400 960 1960 890" stroke-width="80"/></g>
    <g filter="url(#paint)"><text id="k1" class="t" x="960" y="330" font-size="118" style="fill:#1a120c;stroke:none" opacity="0">This is the story</text><text id="k2" class="t" x="960" y="480" font-size="118" style="fill:#1a120c;stroke:none" opacity="0">of how lighting</text><text id="k3" class="t" x="960" y="630" font-size="118" style="fill:#1a120c;stroke:none" opacity="0">a candle became</text><text id="k4" class="t" x="960" y="780" font-size="118" style="fill:#1a120c;stroke:none" opacity="0"><tspan style="fill:#a8432b;stroke:none">an occupational hazard.</tspan></text>
      <path id="ul" d="M470 835 C760 815 1100 850 1450 822" fill="none" stroke="#a8432b" stroke-width="16" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
      <circle class="ink" cx="300" cy="300" r="9" fill="#1a120c"/><circle class="ink" cx="1640" cy="420" r="13" fill="#1a120c"/><circle class="ink" cx="1560" cy="790" r="7" fill="#1a120c"/><circle class="ink" cx="250" cy="760" r="11" fill="#a8432b"/><circle class="ink" cx="1710" cy="250" r="8" fill="#a8432b"/></g>
  </g>
  <g id="burn" opacity="0"><polyline id="b_sc" fill="none" stroke="#6b4a22" stroke-width="130" opacity=".28" stroke-linejoin="round"/><polyline id="b_ch" fill="none" stroke="#1a120c" stroke-width="40" opacity=".9" stroke-linejoin="round"/></g>
  <text id="a1" class="t" x="960" y="850" font-size="76" opacity="0">until it had already</text><text id="a2" class="t" x="960" y="950" font-size="76" opacity="0">disfigured thousands of people.</text><text id="c1" class="t" x="960" y="850" font-size="78" opacity="0">Before matches, starting</text><text id="c2" class="t" x="960" y="950" font-size="78" opacity="0">a fire meant</text><text id="d1" class="t" x="960" y="850" font-size="80" opacity="0">flint, steel, and</text><text id="d2" class="t" x="960" y="950" font-size="92" opacity="0"><tspan class="g">patience</tspan> &#8212;</text><text id="e1" class="t" x="960" y="850" font-size="76" opacity="0">or keeping an existing <tspan class="g">flame</tspan></text><text id="e2" class="t" x="960" y="950" font-size="76" opacity="0"><tspan class="g">alive</tspan> constantly,</text><text id="f1" class="t" x="960" y="850" font-size="76" opacity="0">because relighting one from</text><text id="f2" class="t" x="960" y="950" font-size="76" opacity="0">scratch was genuinely <tspan class="g">difficult.</tspan></text>
</g>
</svg>
</div>
<div id="bar">
  <button id="pp">Pause</button>
  <input id="scrub" type="range" min="0" max="25960" value="0" step="1">
  <span id="time">0.00 / 25.96</span>
  <button id="dl">Download MP4</button>
  <span id="msg"></span>
</div>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.5/build/mp4-muxer.js"></script>
<script>
window.DURATION = 25.96;
var FPS = 30, exporting = false, playing = true, tNow = 0;
function $(id){ var e = document.getElementById(id); if(!e) throw new Error('missing #'+id); return e; }
function clamp(x){ return x<0?0:(x>1?1:x); }
function eo(x){ x=clamp(x); return 1-Math.pow(1-x,3); }
function eio(x){ x=clamp(x); return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function lerp(a,b,k){ return a+(b-a)*k; }
var NS='http://www.w3.org/2000/svg';
function line(e,tin,tout,t){ var k=eo((t-tin)/0.8), o=1-eio((t-tout)/0.45); e.setAttribute('opacity',(k*o).toFixed(3)); e.setAttribute('transform','translate(0 '+(26*(1-k)).toFixed(2)+')'); }
function zoom(e,a,s0,s1,cx,cy,k){ var s=lerp(s0,s1,k); e.setAttribute('opacity',a.toFixed(3)); e.setAttribute('transform','translate('+cx+' '+cy+') scale('+s.toFixed(4)+') translate('+(-cx)+' '+(-cy)+')'); }
function puff(sm,sp,ex,ey,t,on,dx,dy){
  for (var k=0;k<sm.length;k++){ var ph=(t*0.17+k/sm.length)%1;
    sm[k].setAttribute('cx',(ex+dx*ph+22*Math.sin(ph*5+k)).toFixed(1)); sm[k].setAttribute('cy',(ey+dy*ph).toFixed(1));
    sm[k].setAttribute('r',(50+120*ph).toFixed(1)); sm[k].setAttribute('opacity',(on*Math.sin(Math.PI*ph)*0.8).toFixed(3)); }
  for (var j=0;j<sp.length;j++){ var q=(t*0.45+j/sp.length)%1;
    sp[j].setAttribute('cx',(ex+(j-3)*16*q+8*Math.sin(q*9+j)).toFixed(1)); sp[j].setAttribute('cy',(ey-10-q*150).toFixed(1));
    sp[j].setAttribute('opacity',(on*(1-q)*0.9).toFixed(3)); }
}
function edge(y,X,t){ return X+62*Math.sin(y*0.011+1.3)+34*Math.sin(y*0.029+2.1)+12*Math.sin(y*0.066+t*1.2); }
var dust=[]; for (var di=0;di<18;di++){ var dc=document.createElementNS(NS,'circle'); dc.setAttribute('r',2+di%3); $('dust').appendChild(dc); dust.push(dc); }
function dustR(t){ for (var k=0;k<dust.length;k++){ dust[k].setAttribute('cx',(((k*137+t*(12+k%5*4))%1920)).toFixed(1)); dust[k].setAttribute('cy',((((k*271-t*(10+k%4*6))%1080)+1080)%1080).toFixed(1)); dust[k].setAttribute('opacity',(0.3*(0.5+0.5*Math.sin(t*1.3+k))*eo(t)).toFixed(3)); } }
function goldR(t){ var sx=(t*110)%700; $('gold').setAttribute('x1',sx); $('gold').setAttribute('x2',sx+700); }
window.seek=function(t){ tNow=t; render(t); $('scrub').value=Math.round(t*1000); $('time').textContent=t.toFixed(2)+' / '+window.DURATION.toFixed(2); };
var T={}; ['a1','a2','c1','c2','d1','d2','e1','e2','f1','f2','k1','k2','k3','k4'].forEach(function(k){ T[k]=$(k); });
var E={}; ['z12','z13','z14','wg','fg','bg2','lg','hg','hf','card','ul','mp','burn','b_sc','b_ch','scr','stage'].forEach(function(k){ E[k]=$(k); });
var sm12=document.querySelectorAll('.sm12'), sp13=document.querySelectorAll('.sp13'), sm14=document.querySelectorAll('.sm14'), sp14=document.querySelectorAll('.sp14'), ink=document.querySelectorAll('.ink');
function render(t){
  t=Math.max(0,Math.min(window.DURATION,t));
  line(T.a1,0.3,3.7,t); line(T.a2,0.48,3.7,t);
  // painted title card (full screen, no photo behind it)
  line(T.k1,4.5,10.7,t); line(T.k2,5.6,10.7,t); line(T.k3,7.0,10.7,t); line(T.k4,8.4,10.7,t);
  line(T.c1,11.6,14.2,t); line(T.c2,11.78,14.2,t); line(T.d1,14.4,16.7,t); line(T.d2,14.58,16.7,t);
  line(T.e1,17.6,21.0,t); line(T.e2,17.78,21.0,t); line(T.f1,21.3,25.2,t); line(T.f2,21.48,25.2,t);
  goldR(t); dustR(t);
  E.stage.setAttribute('opacity',(1-eio((t-25.3)/0.6)).toFixed(3));
  var cardA=(t<10.9?1:1-eio((t-10.9)/0.6)); E.card.setAttribute('opacity',(t>3.9?cardA:0).toFixed(3));
  E.scr.setAttribute('opacity',(1-(t>3.9?cardA:0)).toFixed(3));
  zoom(E.z12,eo(t/0.7),1.0,1.12,964,596,eio(t/4.4));
  zoom(E.z13,eio((t-10.8)/0.7),1.0,1.07,1185,700,eio((t-10.8)/6.6));
  zoom(E.z14,eio((t-17.1)/0.7),1.0,1.1,1192,690,eio((t-17.1)/8.4));
  // scene 12: haze drifts out of the doorway, the window light flickers
  var on=eo((t-0.3)/1.0); puff(sm12,[],964,640,t,on,-30,-420);
  E.wg.setAttribute('opacity',(on*(0.45+0.15*Math.sin(t*2.3)+0.05*Math.sin(t*9))).toFixed(3));
  // painted card: wet-ink wipe in from the left, brush underline, ink drops
  var X=lerp(-160,2120,eio((t-4.0)/0.9)), pts=[], P=[];
  for (var y=-40;y<=1120;y+=20){ var xe=edge(y,X,t); pts.push(xe.toFixed(1)+','+y); P.push([xe,y]); }
  E.mp.setAttribute('points','-60,-60 '+pts.join(' ')+' -60,1120');
  function off(d){ return P.map(function(e){return (e[0]+d).toFixed(1)+','+e[1];}).join(' '); }
  E.b_sc.setAttribute('points',off(70)); E.b_ch.setAttribute('points',off(20));
  E.burn.setAttribute('opacity',(clamp((t-3.95)/0.08)*(1-clamp((t-4.95)/0.12))).toFixed(3));
  E.ul.setAttribute('stroke-dashoffset',(1-eio((t-9.4)/1.0)).toFixed(3));
  for (var i=0;i<ink.length;i++) ink[i].setAttribute('opacity',eo((t-5.2-i*0.9)/0.5).toFixed(3));
  // scene 13: flint on steel, again and again; each strike throws sparks
  var B=[12.2,13.3,14.4,15.5], b0=-1; for (var q=0;q<B.length;q++) if (t>=B[q]) b0=B[q];
  var u=b0<0?9:t-b0, ox=1185, oy=738;
  E.fg.setAttribute('opacity',(b0<0?0:Math.exp(-u*3.5)*0.95).toFixed(3));
  for (var k=0;k<sp13.length;k++){ var ang=-0.15-((k*0.618)%1)*1.25, sp=170+((k*0.754)%1)*280;
    sp13[k].setAttribute('cx',(ox+Math.cos(ang)*sp*u).toFixed(1)); sp13[k].setAttribute('cy',(oy+Math.sin(ang)*sp*u+320*u*u).toFixed(1));
    sp13[k].setAttribute('opacity',(u>0.9?0:Math.max(0,1-u/0.9)).toFixed(3)); }
  E.bg2.setAttribute('opacity',(eo((t-14.6)/1.2)*(0.7+0.2*Math.sin(t*5))*(1-eio((t-16.4)/0.6))).toFixed(3));
  E.lg.setAttribute('opacity',(eio((t-11.2)/0.8)*(0.7+0.2*Math.sin(t*4))).toFixed(3));
  // scene 14: the banked ember is kept alive; it breathes, and sparks and steam rise
  var o2=eo((t-17.4)/0.9), br=0.75+0.2*Math.sin(t*1.6)+0.05*Math.sin(t*7.3);
  E.hg.setAttribute('opacity',(o2*br).toFixed(3));
  E.hf.setAttribute('transform','translate(1192 705) scale('+(0.7*o2*(1+0.06*Math.sin(t*8))).toFixed(3)+' '+(0.7*o2*(1+0.1*Math.sin(t*10+1))).toFixed(3)+')');
  puff(sm14,sp14,1289,470,t,o2,30,-260);
  for (var j=0;j<sp14.length;j++){ var r=((t*0.3)+j/sp14.length)%1; sp14[j].setAttribute('cx',(1192+(j-4)*22*r+14*Math.sin(r*7+j)).toFixed(1)); sp14[j].setAttribute('cy',(690-r*320).toFixed(1)); sp14[j].setAttribute('opacity',(o2*Math.sin(Math.PI*r)*0.9).toFixed(3)); }
}

// player
var last = null;
function tick(ts){
  if (!exporting && playing){
    if (last===null) last = ts;
    tNow += (ts-last)/1000;
    if (tNow > window.DURATION) tNow = 0;
    window.seek(tNow);
  }
  last = ts; requestAnimationFrame(tick);
}
$('pp').onclick = function(){ playing=!playing; this.textContent = playing?'Pause':'Play'; };
$('scrub').oninput = function(){ playing=false; $('pp').textContent='Play'; window.seek(this.value/1000); };
function msg(s){ $('msg').textContent = s; }

// ---------- export: deterministic frame stepping ----------
function withTimeout(p, ms){ return Promise.race([p, new Promise(function(_,rj){ setTimeout(function(){ rj(new Error('timeout')); }, ms); })]); }
async function fontCss(){
  try{
    var css = await withTimeout(fetch('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap').then(function(r){return r.text();}), 6000);
    var urls = css.match(/url\(([^)]+)\)/g) || [];
    for (var i=0;i<urls.length;i++){
      var u = urls[i].slice(4,-1).replace(/['"]/g,'');
      var buf = await withTimeout(fetch(u).then(function(r){return r.arrayBuffer();}), 6000);
      var bin='', by=new Uint8Array(buf); for (var k=0;k<by.length;k+=8192) bin += String.fromCharCode.apply(null, by.subarray(k,k+8192));
      css = css.replace(urls[i], 'url(data:font/woff2;base64,'+btoa(bin)+')');
    }
    return css;
  }catch(e){ return ''; }
}
async function exportMp4(){
  var step='setup', frame=-1;
  try{
    if (!window.VideoEncoder) throw new Error('WebCodecs VideoEncoder not available here');
    if (!window.Mp4Muxer) throw new Error('mp4-muxer failed to load');
    exporting = true; playing=false; $('dl').disabled = true;
    var css = await fontCss(); step='encoder';
    var sup = VideoEncoder.isSupported ? await VideoEncoder.isSupported({codec:'avc1.64002A',width:1920,height:1080,bitrate:14e6,framerate:FPS}) : {supported:true}; if(!sup.supported) throw new Error('this browser cannot encode H.264 1080p30 - use desktop Chrome, or the Playwright+ffmpeg script');
    var muxer = new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(), video:{codec:'avc',width:1920,height:1080}, fastStart:'in-memory'});
    var encErr = null;
    var enc = new VideoEncoder({output:function(c,m){ muxer.addVideoChunk(c,m); }, error:function(e){ encErr=e; window.__encErr=e; }});
    enc.configure({codec:'avc1.64002A',width:1920,height:1080,bitrate:14e6,framerate:FPS});
    var cv = document.createElement('canvas'); cv.width=1920; cv.height=1080; var cx = cv.getContext('2d');
    var N = Math.round(window.DURATION*FPS);
    for (var i=-1;i<N;i++){
      frame = i; step='render';
      render(Math.max(0,i)/FPS);
      var c = $('svg').cloneNode(true); c.setAttribute('width',1920); c.setAttribute('height',1080);
      var st = document.createElementNS('http://www.w3.org/2000/svg','style'); st.textContent = css; c.insertBefore(st, c.firstChild);
      step='serialize';
      var xml = new XMLSerializer().serializeToString(c);
      var img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
      step='decode'; await img.decode();
      cx.clearRect(0,0,1920,1080); cx.drawImage(img,0,0,1920,1080);
      if (i<0) continue; // warm-up frame (fonts)
      step='encode';
      var vf = new VideoFrame(cv,{timestamp:Math.round(i*1e6/FPS), duration:Math.round(1e6/FPS)});
      enc.encode(vf,{keyFrame:i%60===0}); vf.close();
      if (encErr) throw encErr;
      while (enc.encodeQueueSize>6) await new Promise(function(r){ setTimeout(r,5); });
      if (i%10===0) msg('Exporting '+Math.round(i/N*100)+'%');
    }
    step='finalize'; await enc.flush(); muxer.finalize();
    var blob = new Blob([muxer.target.buffer],{type:'video/mp4'});
    step='save'; msg('Saving…');
    var dls = null; try{ dls = window.claude && await window.claude.use('downloads'); }catch(e){}
    if (dls) await dls.save({filename:'Matches scene 12-14.mp4', data:blob});
    else { var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Matches scene 12-14.mp4'; a.click(); }
    msg('Done ('+N+' frames).');
  }catch(e){
    msg('Export failed at frame '+frame+' ('+step+'): '+(e&&e.message?e.message:e)+(window.__encErr?' ['+window.__encErr.message+']':''));
  }finally{
    exporting=false; $('dl').disabled=false; last=null;
  }
}
$('dl').onclick = exportMp4;

window.seek(0);
requestAnimationFrame(tick);
</script>
</body></html>
