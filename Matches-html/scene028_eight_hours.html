<script>

function $(id){ var e = document.getElementById(id); if(!e) throw new Error('missing #'+id); return e; }
function clamp(x){ return x<0?0:(x>1?1:x); }
function eo(x){ x=clamp(x); return 1-Math.pow(1-x,3); }
function eio(x){ x=clamp(x); return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }

    sm[k].setAttribute('cx',(ex+dx*ph+22*Math.sin(ph*5+k)).toFixed(1)); sm[k].setAttribute('cy',(ey+dy*ph).toFixed(1));
    sm[k].setAttribute('r',(50+120*ph).toFixed(1)); sm[k].setAttribute('opacity',(on*Math.sin(Math.PI*ph)*0.8).toFixed(3)); }

}

var E={}; ['z28','z29','clk','wedge','hh','stage'].forEach(function(k){ E[k]=$(k); });
var sm=document.querySelectorAll('.sm28'), fog=document.querySelectorAll('.fog'), wn=document.querySelectorAll('.wn'), CH=[(1154, 40), (1352, 135), (636, 60), (1502, 245), (311, 165), (1015, 130)];

  zoom(E.z29,eio((t-4.8)/0.7),1.0,1.08,1000,520,eio((t-4.8)/2.2));
  // scene 28: chimneys smoke, windows glow warm and flicker, a pale green mist creeps along the ground
  var on=eo((t-0.3)/1.0);

function withTimeout(p, ms){ return Promise.race([p, new Promise(function(_,rj){ setTimeout(function(){ rj(new Error('timeout')); }, ms); })]); }

  try{
    var css = await withTimeout(fetch('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap').then(function(r){return r.text();}), 6000);
    var urls = css.match(/url\(([^)]+)\)/g) || [];
    for (var i=0;i<urls.length;i++){
      var u = urls[i].slice(4,-1).replace(/['"]/g,'');
      var buf = await withTimeout(fetch(u).then(function(r){return r.arrayBuffer();}), 6000);

      enc.encode(vf,{keyFrame:i%60===0}); vf.close();
      if (encErr) throw encErr;
      while (enc.encodeQueueSize>6) await new Promise(function(r){ setTimeout(r,5); });
      if (i%10===0) msg('Exporting '+Math.round(i/N*100)+'%');
    }
    step='finalize'; await enc.flush(); muxer.finalize();
    var blob = new Blob([muxer.target.buffer],{type:'video/mp4'});
    step='save'; msg('Saving…');
    var dls = null; try{ dls = window.claude && await window.claude.use('downloads'); }catch(e){}
    if (dls) await dls.save({filename:'Matches scene 28-29.mp4', data:blob});
    else { var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Matches scene 28-29.mp4'; a.click(); }
    msg('Done ('+N+' frames).');
  }catch(e){
    msg('Export failed at frame '+frame+' ('+step+'): '+(e&&e.message?e.message:e)+(window.__encErr?' ['+window.__encErr.message+']':''));
  }finally{
    exporting=false; $('dl').disabled=false; last=null;
  }
}
$('dl').onclick = exportMp4;

window.seek(0);
requestAnimationFrame(tick);
</script>
</body></html>
