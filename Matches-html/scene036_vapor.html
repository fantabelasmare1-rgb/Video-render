  <text id="a1" class="t" x="960" y="850" font-size="76" opacity="0">White phosphorus is also</text><text id="a2" class="t" x="960" y="950" font-size="76" opacity="0">acutely <tspan class="g">toxic.</tspan></text><text id="b1" class="t" x="960" y="775" font-size="74" opacity="0">Workers breathed in</text><text id="b2" class="t" x="960" y="865" font-size="74" opacity="0">phosphorus vapor for hours a day,</text><text id="b3" class="t" x="960" y="955" font-size="74" opacity="0">day after day,</text><text id="c1" class="t" x="960" y="850" font-size="78" opacity="0">often in <tspan class="g">poorly ventilated</tspan></text><text id="c2" class="t" x="960" y="950" font-size="78" opacity="0">factory rooms.</text><text id="d1" class="t" x="960" y="775" font-size="74" opacity="0">And phosphorus has a specific,</text><text id="d2" class="t" x="960" y="865" font-size="74" opacity="0">gruesome relationship with</text><text id="d3" class="t" x="960" y="955" font-size="90" opacity="0"><tspan class="g">human bone.</tspan></text>
</g>
</svg>
</div>
<div id="bar">
  <button id="pp">Pause</button>
  <input id="scrub" type="range" min="0" max="17740" value="0" step="1">
  <span id="time">0.00 / 17.74</span>
  <button id="dl">Download MP4</button>
  <span id="msg"></span>
</div>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.5/build/mp4-muxer.js"></script>
<script>
window.DURATION = 17.74;
var FPS = 30, exporting = false, playing = true, tNow = 0;
function $(id){ var e = document.getElementById(id); if(!e) throw new Error('missing #'+id); return e; }
function clamp(x){ return x<0?0:(x>1?1:x); }
function eo(x){ x=clamp(x); return 1-Math.pow(1-x,3); }
function eio(x){ x=clamp(x); return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function lerp(a,b,k){ return a+(b-a)*k; }
var NS='http://www.w3.org/2000/svg';
function line(e,tin,tout,t){ var k=eo((t-tin)/0.8), o=1-eio((t-tout)/0.45); e.setAttribute('opacity',(k*o).toFixed(3)); e.setAttribute('transform','translate(0 '+(26*(1-k)).toFixed(2)+')'); }
function zoom(e,a,s0,s1,cx,cy,k){ var s=lerp(s0,s1,k); e.setAttribute('opacity',a.toFixed(3)); e.setAttribute('transform','translate('+cx+' '+cy+') scale('+s.toFixed(4)+') translate('+(-cx)+' '+(-cy)+')'); }
function puff(sm,sp,ex,ey,t,on,dx,dy){
  for (var k=0;k<sm.length;k++){ var ph=(t*0.17+k/sm.length)%1;
    sm[k].setAttribute('cx',(ex+dx*ph+22*Math.sin(ph*5+k)).toFixed(1)); sm[k].setAttribute('cy',(ey+dy*ph).toFixed(1));
    sm[k].setAttribute('r',(50+120*ph).toFixed(1)); sm[k].setAttribute('opacity',(on*Math.sin(Math.PI*ph)*0.8).toFixed(3)); }
  for (var j=0;j<sp.length;j++){ var q=(t*0.45+j/sp.length)%1;
    sp[j].setAttribute('cx',(ex+(j-3)*16*q+8*Math.sin(q*9+j)).toFixed(1)); sp[j].setAttribute('cy',(ey-10-q*150).toFixed(1));
    sp[j].setAttribute('opacity',(on*(1-q)*0.9).toFixed(3)); }
}
function edge(y,X,t){ return X+62*Math.sin(y*0.011+1.3)+34*Math.sin(y*0.029+2.1)+12*Math.sin(y*0.066+t*1.2); }
var dust=[]; for (var di=0;di<18;di++){ var dc=document.createElementNS(NS,'circle'); dc.setAttribute('r',2+di%3); $('dust').appendChild(dc); dust.push(dc); }
function dustR(t){ for (var k=0;k<dust.length;k++){ dust[k].setAttribute('cx',(((k*137+t*(12+k%5*4))%1920)).toFixed(1)); dust[k].setAttribute('cy',((((k*271-t*(10+k%4*6))%1080)+1080)%1080).toFixed(1)); dust[k].setAttribute('opacity',(0.3*(0.5+0.5*Math.sin(t*1.3+k))*eo(t)).toFixed(3)); } }
function goldR(t){ var sx=(t*110)%700; $('gold').setAttribute('x1',sx); $('gold').setAttribute('x2',sx+700); }
window.seek=function(t){ tNow=t; render(t); $('scrub').value=Math.round(t*1000); $('time').textContent=t.toFixed(2)+' / '+window.DURATION.toFixed(2); };
var T={}; ['a1','a2','b1','b2','b3','c1','c2','d1','d2','d3'].forEach(function(k){ T[k]=$(k); });
var E={}; ['z36','z37','z38','vg','lh','clk','hand','stage'].forEach(function(k){ E[k]=$(k); });
var v36=document.querySelectorAll('.v36'), sm=document.querySelectorAll('.sm38'), pg=document.querySelectorAll('.pg'), BW=[(1018, 735), (1251, 803), (1536, 885), (816, 668)];
function render(t){
  t=Math.max(0,Math.min(window.DURATION,t));
  line(T.a1,0.3,3.8,t); line(T.a2,0.48,3.8,t); line(T.b1,4.1,8.8,t); line(T.b2,4.28,8.8,t); line(T.b3,4.46,8.8,t);
  line(T.c1,9.5,12.2,t); line(T.c2,9.68,12.2,t); line(T.d1,12.8,17.1,t); line(T.d2,12.98,17.1,t); line(T.d3,13.16,17.1,t);
  goldR(t); dustR(t);
  E.stage.setAttribute('opacity',(1-eio((t-17.2)/0.5)).toFixed(3));
  zoom(E.z36,eo(t/0.8),1.02,1.1,960,500,eio(t/9.6));
  zoom(E.z37,eio((t-9.0)/0.7),1.0,1.08,960,540,eio((t-9.0)/3.8));
  zoom(E.z38,eio((t-12.4)/0.7),1.0,1.1,1100,740,eio((t-12.4)/5.3));
  // scene 36: hours pass on a little clock (a dot lands for each day) while pale green vapor thickens through the haze
  E.clk.setAttribute('opacity',(eo((t-0.6)/0.6)*(1-eio((t-9.0)/0.5))).toFixed(3));
  E.hand.setAttribute('transform','rotate('+(360*t/3).toFixed(1)+')');
  for (var d=0;d<7;d++) $('dy'+d).setAttribute('opacity',(eo((t-1.2-d*1.1)/0.4)).toFixed(3));
  for (var k=0;k<v36.length;k++){ var ph=(t*0.07+k/v36.length)%1, th=eo((t-0.5)/3);
    v36[k].setAttribute('cx',(lerp(1700,200+k*210,ph)+40*Math.sin(t*0.5+k)).toFixed(1)); v36[k].setAttribute('cy',(380+((k*97)%360)-ph*60).toFixed(1));
    v36[k].setAttribute('opacity',(th*Math.sin(Math.PI*ph)*(t<9.2?0.9:0.9*(1-eio((t-9.2)/0.6)))).toFixed(3)); }
  // scene 37: the room closes in
  E.vg.setAttribute('opacity',(0.7*eo((t-9.2)/0.5)*(1-eio((t-12.4)/0.5))).toFixed(3));
  E.lh.setAttribute('cx',960); E.lh.setAttribute('cy',520); E.lh.setAttribute('r',lerp(1500,900,eio((t-9.2)/3.2)).toFixed(1));
  // scene 38: green glow and vapor rise from the dipping bowls
  var on=eo((t-12.8)/0.9), big=eo((t-15.0)/1.5);
  for (var g=0;g<pg.length;g++) pg[g].setAttribute('opacity',Math.min(1,on*(0.9+0.4*big)*(0.8+0.2*Math.sin(t*3+g))).toFixed(3));
  for (var s=0;s<sm.length;s++){ var b=BW[s%4], q=((t*0.2)+s/sm.length)%1;
    sm[s].setAttribute('cx',(b[0]+30*Math.sin(q*5+s)-q*60).toFixed(1)); sm[s].setAttribute('cy',(b[1]-20-q*300).toFixed(1)); sm[s].setAttribute('r',(40+100*q).toFixed(1)); sm[s].setAttribute('opacity',(on*Math.sin(Math.PI*q)*1.0).toFixed(3)); }
}

// player
var last = null;
function tick(ts){
  if (!exporting && playing){
    if (last===null) last = ts;
    tNow += (ts-last)/1000;
    if (tNow > window.DURATION) tNow = 0;
    window.seek(tNow);
  }
  last = ts; requestAnimationFrame(tick);
}
$('pp').onclick = function(){ playing=!playing; this.textContent = playing?'Pause':'Play'; };
$('scrub').oninput = function(){ playing=false; $('pp').textContent='Play'; window.seek(this.value/1000); };
function msg(s){ $('msg').textContent = s; }

// ---------- export: deterministic frame stepping ----------
function withTimeout(p, ms){ return Promise.race([p, new Promise(function(_,rj){ setTimeout(function(){ rj(new Error('timeout')); }, ms); })]); }
async function fontCss(){
  try{
    var css = await withTimeout(fetch('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap').then(function(r){return r.text();}), 6000);
    var urls = css.match(/url\(([^)]+)\)/g) || [];
    for (var i=0;i<urls.length;i++){
      var u = urls[i].slice(4,-1).replace(/['"]/g,'');
      var buf = await withTimeout(fetch(u).then(function(r){return r.arrayBuffer();}), 6000);
      var bin='', by=new Uint8Array(buf); for (var k=0;k<by.length;k+=8192) bin += String.fromCharCode.apply(null, by.subarray(k,k+8192));
      css = css.replace(urls[i], 'url(data:font/woff2;base64,'+btoa(bin)+')');
    }
    return css;
  }catch(e){ return ''; }
}
async function exportMp4(){
  var step='setup', frame=-1;
  try{
    if (!window.VideoEncoder) throw new Error('WebCodecs VideoEncoder not available here');
    if (!window.Mp4Muxer) throw new Error('mp4-muxer failed to load');
    exporting = true; playing=false; $('dl').disabled = true;
    var css = await fontCss(); step='encoder';
    var sup = VideoEncoder.isSupported ? await VideoEncoder.isSupported({codec:'avc1.64002A',width:1920,height:1080,bitrate:14e6,framerate:FPS}) : {supported:true}; if(!sup.supported) throw new Error('this browser cannot encode H.264 1080p30 - use desktop Chrome, or the Playwright+ffmpeg script');
    var muxer = new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(), video:{codec:'avc',width:1920,height:1080}, fastStart:'in-memory'});
    var encErr = null;
    var enc = new VideoEncoder({output:function(c,m){ muxer.addVideoChunk(c,m); }, error:function(e){ encErr=e; window.__encErr=e; }});
    enc.configure({codec:'avc1.64002A',width:1920,height:1080,bitrate:14e6,framerate:FPS});
    var cv = document.createElement('canvas'); cv.width=1920; cv.height=1080; var cx = cv.getContext('2d');
    var N = Math.round(window.DURATION*FPS);
    for (var i=-1;i<N;i++){
      frame = i; step='render';
      render(Math.max(0,i)/FPS);
      var c = $('svg').cloneNode(true); c.setAttribute('width',1920); c.setAttribute('height',1080);
      var st = document.createElementNS('http://www.w3.org/2000/svg','style'); st.textContent = css; c.insertBefore(st, c.firstChild);
      step='serialize';
      var xml = new XMLSerializer().serializeToString(c);
      var img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
      step='decode'; await img.decode();
      cx.clearRect(0,0,1920,1080); cx.drawImage(img,0,0,1920,1080);
      if (i<0) continue; // warm-up frame (fonts)
      step='encode';
      var vf = new VideoFrame(cv,{timestamp:Math.round(i*1e6/FPS), duration:Math.round(1e6/FPS)});
      enc.encode(vf,{keyFrame:i%60===0}); vf.close();
      if (encErr) throw encErr;
      while (enc.encodeQueueSize>6) await new Promise(function(r){ setTimeout(r,5); });
      if (i%10===0) msg('Exporting '+Math.round(i/N*100)+'%');
    }
    step='finalize'; await enc.flush(); muxer.finalize();
    var blob = new Blob([muxer.target.buffer],{type:'video/mp4'});
    step='save'; msg('Saving…');
    var dls = null; try{ dls = window.claude && await window.claude.use('downloads'); }catch(e){}
    if (dls) await dls.save({filename:'Matches scene 36-38.mp4', data:blob});
    else { var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Matches scene 36-38.mp4'; a.click(); }
    msg('Done ('+N+' frames).');
  }catch(e){
    msg('Export failed at frame '+frame+' ('+step+'): '+(e&&e.message?e.message:e)+(window.__encErr?' ['+window.__encErr.message+']':''));
  }finally{
    exporting=false; $('dl').disabled=false; last=null;
  }
}
$('dl').onclick = exportMp4;

window.seek(0);
requestAnimationFrame(tick);
</script>
