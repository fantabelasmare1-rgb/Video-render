  zoom(el.z100, eo(t/0.8), 1.03, 1.13, 1211, 589, eio(t/10.4));
  var p=0*eio((t-0.6)/9.6), pt=el.p1.getPointAtLength(Math.max(0.01,L1*p));
  el.char.setAttribute('stroke-dasharray',(L1*p).toFixed(1)+' '+(L1+10));
  var on=eo((t-0.3)/0.8), fl=0.8+0.2*Math.sin(t*7);
  el.eh.setAttribute('cx',pt.x); el.eh.setAttribute('cy',pt.y); el.eh.setAttribute('opacity',(on*fl).toFixed(3));
  el.etg.setAttribute('transform','translate('+pt.x.toFixed(1)+' '+(pt.y+10).toFixed(1)+') scale('+(0.001*on*(1+0.07*Math.sin(t*8))).toFixed(3)+' '+(0.001*on*(1+0.12*Math.sin(t*10+1))).toFixed(3)+')');
  puff(sm1,sp1,pt.x,pt.y,t,on,-420,-330);
  // --- burning-paper swipe 9.55 -> 10.75 (left to right): old still chars and burns away, new still shows behind
  var X=lerp(-160,2120,eio((t-9.55)/1.2)), pts=[], E=[];
  for (var y=-40;y<=1120;y+=20){ var xe=edge(y,X,t); pts.push(xe.toFixed(1)+','+y); E.push([xe,y]); }
  el.mp.setAttribute('points','-60,-60 '+pts.join(' ')+' -60,1120');
  function off(d){ return E.map(function(e){return (e[0]+d).toFixed(1)+','+e[1];}).join(' '); }
  el.b_sc.setAttribute('points',off(140)); el.b_ch.setAttribute('points',off(58)); el.b_gl.setAttribute('points',off(8)); el.b_hot.setAttribute('points',off(6));
  var sw=clamp((t-9.45)/0.2)*(1-clamp((t-10.8)/0.2));
  el.burn.setAttribute('opacity',sw.toFixed(3));
  for (var b=0;b<sb.length;b++){ var yy=(b*109+t*70)%1080, xx=edge(yy,X,t)+14+26*Math.sin(t*3+b)+((t*60+b*37)%60);
    sb[b].setAttribute('cx',xx.toFixed(1)); sb[b].setAttribute('cy',(yy-((t*50+b*20)%50)).toFixed(1)); sb[b].setAttribute('opacity',(sw*0.9).toFixed(3)); }
  // --- still 101: flame breathes while 70 years tick by
  zoom(el.z101, t>9.5?1:0, 1.0, 1.1, 1260, 532, eio((t-9.5)/11.9));
  var on2=eo((t-10.2)/0.8);
  el.fh.setAttribute('opacity',(on2*(0.75+0.2*Math.sin(t*6)+0.05*Math.sin(t*13))).toFixed(3));
  el.ftg.setAttribute('transform','translate('+1198+' '+565+') scale('+(0.6*on2*(1+0.07*Math.sin(t*8))).toFixed(3)+' '+(0.6*on2*(1+0.12*Math.sin(t*10+1))).toFixed(3)+')');
  puff(sm2,sp2,1198+60,565-110,t,on2,-60,-300);
  // --- timeline: ember travels left to right across 70 ticks, lighting each one
  var prog=eio((t-10.5)/10.2), dx=360+1200*prog, ap=eo((t-10.3)/0.6);
  el.tdot.setAttribute('cx',dx.toFixed(1)); el.tdot.setAttribute('opacity',ap.toFixed(3)); el.tdot.setAttribute('r',(9+5*eo((t-19.5)/1.2)).toFixed(1));
  for (var q=0;q<tickEls.length;q++){ var tx=360+q*(1200/69), lit=clamp((dx-tx)/40+0.2);
    tickEls[q].setAttribute('opacity',(ap*lerp(0.28,0.95,lit)).toFixed(3)); tickEls[q].setAttribute('stroke',mix(PARCH,GOLD,lit)); }
  for (var k=0;k<dust.length;k++){ dust[k].setAttribute('cx',(((k*137+t*(12+k%5*4))%1920)).toFixed(1)); dust[k].setAttribute('cy',((((k*271-t*(10+k%4*6))%1080)+1080)%1080).toFixed(1));
    dust[k].setAttribute('opacity',(0.35*(0.5+0.5*Math.sin(t*1.3+k))*eo(t)).toFixed(3)); }
}
window.seek=function(t){ tNow=t; render(t); $('scrub').value=Math.round(t*1000); $('time').textContent=t.toFixed(2)+' / '+window.DURATION.toFixed(2); };

// player
var last = null;
function tick(ts){
  if (!exporting && playing){
    if (last===null) last = ts;
    tNow += (ts-last)/1000;
    if (tNow > window.DURATION) tNow = 0;
    window.seek(tNow);
  }
  last = ts; requestAnimationFrame(tick);
}
$('pp').onclick = function(){ playing=!playing; this.textContent = playing?'Pause':'Play'; };
$('scrub').oninput = function(){ playing=false; $('pp').textContent='Play'; window.seek(this.value/1000); };
function msg(s){ $('msg').textContent = s; }

// ---------- export: deterministic frame stepping ----------
function withTimeout(p, ms){ return Promise.race([p, new Promise(function(_,rj){ setTimeout(function(){ rj(new Error('timeout')); }, ms); })]); }
async function fontCss(){
  try{
    var css = await withTimeout(fetch('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap').then(function(r){return r.text();}), 6000);
    var urls = css.match(/url\(([^)]+)\)/g) || [];
    for (var i=0;i<urls.length;i++){
      var u = urls[i].slice(4,-1).replace(/['"]/g,'');
      var buf = await withTimeout(fetch(u).then(function(r){return r.arrayBuffer();}), 6000);
      var bin='', by=new Uint8Array(buf); for (var k=0;k<by.length;k+=8192) bin += String.fromCharCode.apply(null, by.subarray(k,k+8192));
      css = css.replace(urls[i], 'url(data:font/woff2;base64,'+btoa(bin)+')');
    }
    return css;
  }catch(e){ return ''; }
}
async function exportMp4(){
  var step='setup', frame=-1;
  try{
    if (!window.VideoEncoder) throw new Error('WebCodecs VideoEncoder not available here');
    if (!window.Mp4Muxer) throw new Error('mp4-muxer failed to load');
    exporting = true; playing=false; $('dl').disabled = true;
    var css = await fontCss(); step='encoder';
    var sup = VideoEncoder.isSupported ? await VideoEncoder.isSupported({codec:'avc1.64002A',width:1920,height:1080,bitrate:14e6,framerate:FPS}) : {supported:true}; if(!sup.supported) throw new Error('this browser cannot encode H.264 1080p30 - use desktop Chrome, or the Playwright+ffmpeg script');
    var muxer = new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(), video:{codec:'avc',width:1920,height:1080}, fastStart:'in-memory'});
    var encErr = null;
    var enc = new VideoEncoder({output:function(c,m){ muxer.addVideoChunk(c,m); }, error:function(e){ encErr=e; window.__encErr=e; }});
    enc.configure({codec:'avc1.64002A',width:1920,height:1080,bitrate:14e6,framerate:FPS});
    var cv = document.createElement('canvas'); cv.width=1920; cv.height=1080; var cx = cv.getContext('2d');
    var N = Math.round(window.DURATION*FPS);
    for (var i=-1;i<N;i++){
      frame = i; step='render';
      render(Math.max(0,i)/FPS);
      var c = $('svg').cloneNode(true); c.setAttribute('width',1920); c.setAttribute('height',1080);
      var st = document.createElementNS('http://www.w3.org/2000/svg','style'); st.textContent = css; c.insertBefore(st, c.firstChild);
      step='serialize';
      var xml = new XMLSerializer().serializeToString(c);
      var img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
      step='decode'; await img.decode();
      cx.clearRect(0,0,1920,1080); cx.drawImage(img,0,0,1920,1080);
      if (i<0) continue; // warm-up frame (fonts)
      step='encode';
      var vf = new VideoFrame(cv,{timestamp:Math.round(i*1e6/FPS), duration:Math.round(1e6/FPS)});
      enc.encode(vf,{keyFrame:i%60===0}); vf.close();
      if (encErr) throw encErr;
      while (enc.encodeQueueSize>6) await new Promise(function(r){ setTimeout(r,5); });
      if (i%10===0) msg('Exporting '+Math.round(i/N*100)+'%');
    }
    step='finalize'; await enc.flush(); muxer.finalize();
    var blob = new Blob([muxer.target.buffer],{type:'video/mp4'});
    step='save'; msg('Saving…');
    var dls = null; try{ dls = window.claude && await window.claude.use('downloads'); }catch(e){}
    if (dls) await dls.save({filename:'Matches scene 100-101.mp4', data:blob});
    else { var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Matches scene 100-101.mp4'; a.click(); }
    msg('Done ('+N+' frames).');
  }catch(e){
    msg('Export failed at frame '+frame+' ('+step+'): '+(e&&e.message?e.message:e)+(window.__encErr?' ['+window.__encErr.message+']':''));
  }finally{
    exporting=false; $('dl').disabled=false; last=null;
  }
}
$('dl').onclick = exportMp4;

window.seek(0);
requestAnimationFrame(tick);
</script>
